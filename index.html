<script>
    const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC_FEED = "spoonsteady/telemetry";

    let client = null;
    let currentRole = "sensor";
    let audioCtx = null;
    let totalScoops = 0;
    let isInScoopMotion = false;
    let lastPublish = 0;
    let currentPitch = 0;

    function setRole(role) {
      currentRole = role;
      document.getElementById("btnRoleSensor").classList.toggle("active", role === "sensor");
      document.getElementById("btnRoleMonitor").classList.toggle("active", role === "monitor");
      document.getElementById("panelSensor").style.display = role === "sensor" ? "block" : "none";
      document.getElementById("panelMonitor").style.display = role === "monitor" ? "block" : "none";
      writeLog(`Beralih mode: ${role === "sensor" ? "HP 1 (Sensor Tangan)" : "HP 2 (Monitor Meja)"}`);
    }

    function writeLog(msg) {
      const log = document.getElementById("logText");
      const time = new Date().toLocaleTimeString();
      log.innerHTML = `[${time}] ${msg}<br>` + log.innerHTML;
    }

    function initApp() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}

      document.getElementById("btnStart").innerText = "Menghubungkan MQTT...";
      writeLog("Menghubungkan ke broker MQTT...");

      // Minta izin sensor jika di iOS Safari
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission().then(res => {
          if (res === "granted") startSensors();
          else writeLog("Izin gerak ditolak.");
        }).catch(err => writeLog("Error izin: " + err));
      } else {
        startSensors();
      }

      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().catch(() => {});
      }

      client = mqtt.connect(BROKER_URL);

      client.on("connect", () => {
        document.getElementById("connStatus").className = "badge connected";
        document.getElementById("connStatus").innerText = "Online";
        document.getElementById("btnStart").innerText = "Sistem Aktif";
        writeLog("Broker HiveMQ terhubung (Online).");
        client.subscribe(TOPIC_FEED);
      });

      client.on("message", (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          if (topic === TOPIC_FEED && currentRole === "monitor") {
            updateMonitorView(data);
          }
        } catch (e) {}
      });

      client.on("error", (err) => {
        writeLog("MQTT Error: " + err);
      });
    }

    function startSensors() {
      writeLog("Sensor gerak & sudut aktif.");

      // 1. Coba baca orientasi gyroscope bawaan
      window.addEventListener("deviceorientation", (e) => {
        if (e.beta !== null && e.beta !== undefined) {
          currentPitch = Math.round(e.beta);
          const el = document.getElementById("tiltSensorVal");
          if (el) el.innerText = `${currentPitch}°`;
        }
      });

      // 2. Baca akselerometer & hitung sudut pitch cadangan dari gravitasi (acc.y & acc.z)
      window.addEventListener("devicemotion", (e) => {
        const acc = e.accelerationIncludingGravity;
        if (!acc) return;

        const ax = acc.x || 0;
        const ay = acc.y || 0;
        const az = acc.z || 0;

        // Deviasi getaran tremor (RMS)
        const totalMag = Math.sqrt(ax * ax + ay * ay + az * az);
        const rmsDeviation = Math.abs(totalMag - 9.81);

        // Jika sensor gyroscope tidak tersedia, hitung sudut kemiringan pitch dari gaya gravitasi
        if (currentPitch === 0 && (ay !== 0 || az !== 0)) {
          const calculatedPitch = Math.round(Math.atan2(ay, Math.sqrt(ax * ax + az * az)) * (180 / Math.PI));
          currentPitch = calculatedPitch;
          const el = document.getElementById("tiltSensorVal");
          if (el) el.innerText = `${currentPitch}°`;
        }

        const rmsEl = document.getElementById("rmsSensorVal");
        if (rmsEl) rmsEl.innerText = `${rmsDeviation.toFixed(2)} m/s²`;

        // Kirim ke MQTT setiap 200 ms
        const now = Date.now();
        if (currentRole === "sensor" && client && client.connected && (now - lastPublish > 200)) {
          lastPublish = now;
          client.publish(TOPIC_FEED, JSON.stringify({
            rms: Number(rmsDeviation.toFixed(2)),
            pitch: currentPitch
          }));
        }
      });
    }

    function updateMonitorView(data) {
      const rms = data.rms;
      const pitch = data.pitch;

      document.getElementById("monitorRms").innerText = `${rms.toFixed(2)} m/s²`;

      let stability = Math.max(10, Math.round(100 - (rms * 28)));
      document.getElementById("stabilityScore").innerText = stability;

      const indicator = document.getElementById("tremorIndicator");
      const circle = document.getElementById("scoreCircle");

      if (rms < 0.8) {
        indicator.className = "status-alert calm";
        indicator.innerText = "Kondisi Tangan Tenang & Stabil";
        circle.style.borderColor = "var(--safe)";
      } else if (rms >= 0.8 && rms < 2.0) {
        indicator.className = "status-alert mild";
        indicator.innerText = "Getaran Ringan Terdeteksi";
        circle.style.borderColor = "var(--warning)";
      } else {
        indicator.className = "status-alert tremor";
        indicator.innerText = "⚠️ Tremor Signifikan! Makanan Berisiko Tumpah";
        circle.style.borderColor = "var(--danger)";
      }

      // Deteksi suapan: naik di atas 35 derajat lalu turun ke bawah 15 derajat
      if (pitch > 35 && !isInScoopMotion) {
        isInScoopMotion = true;
      } else if (pitch < 15 && isInScoopMotion) {
        isInScoopMotion = false;
        totalScoops++;
        document.getElementById("scoopCount").innerText = `${totalScoops} Kali`;
        writeLog(`Suapan ke-${totalScoops} terdeteksi.`);
      }
    }
  </script>
